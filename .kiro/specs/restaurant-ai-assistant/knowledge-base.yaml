    Orion is a cafe-bar in central Kyiv. Our signature is the hosper (charcoal)
    oven: meat and fish are grilled over charcoal, often right in front of
    guests. Over 11 kinds of fresh draft beer (German, Czech, Spanish, Scottish,
    Irish, local and craft), an impressive choice of homemade infusions, and
    house-made sausages.
