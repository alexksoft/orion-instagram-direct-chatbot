restaurant:
  name: "Orion"
  city: "Київ / Kyiv"
  # Кафе-бар з хоспер-кухнею (м'ясо та рибу готують на вугіллі у хоспер-печі),
  # великий вибір пива та домашніх настоянок. Розташований у центрі Києва.
  description_uk: >
    Orion — кафе-бар у центрі Києва. Наша фішка — хоспер-піч: мʼясо та риба
    готуються на вугіллі, рівномірно обсмажуються з усіх боків, часто прямо на
    очах гостей. Понад 11 сортів свіжого розливного пива (німецькі, чеські,
    іспанські, шотландські, ірландські, вітчизняні та крафтові виробники),
    вражаючий вибір домашніх настоянок і ковбаски власного виробництва.
